services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASS:-devpass}
      POSTGRES_DB: ${PG_DB:-shortener}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-shortener}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DB_ADDR: redis:6379
      APP_PORT: ":3001"
      DOMAIN: localhost:3001
      API_QUOTA: ${API_QUOTA:-10}
      PG_USER: ${PG_USER:-postgres}
      PG_PASS: ${PG_PASS:-devpass}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-shortener}
      REPLICA_DB_HOSTS: ""
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: